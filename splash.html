<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOmarchy — Splash (design reference)</title>
<!-- Static design reference for apk/src/main/assets/splash.html. The two files share the same visual language
     and the same approved bitmap; this one inlines the bytes of 2026-11-05-AOmarchy-LOGO.png so the
     prototype previews offline, the APK one loads assets/brand-logo.png and reads A.info() / A.state().
     Dual-tone system: Indigo #7C8CFF = structure, Signal Green #9CD462 = status only.
     CRT scanlines / vignette / beam / flicker / glow pulse were removed in the brand rollout. -->
<style>
  @font-face {
    font-family: 'OmarchyFont';
    src: url('https://tinker.markcuda.com/omarchy-font/omarchy-font.ttf?v=2.1') format('truetype');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  :root {
    --bg:#0A0C10; --surface:#14171F; --line:#262C3A;
    --text:#E6E9F0; --dim:#A8B3C4; --faint:#7A8595;
    --indigo:#7C8CFF; --indigo-soft:#9AA8FF; --indigo-deep:#4C5BD4;
    --signal:#9CD462;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); overflow: hidden; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; position: relative; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .dots { background-image: radial-gradient(rgba(124,140,255,.14) 1px, transparent 1px); background-size: 24px 24px; opacity: .3; }
  .ambient { background: radial-gradient(circle at 50% 40%, rgba(124,140,255,.10) 0%, transparent 62%); }
  main { position: relative; z-index: 30; flex: 1; width: 100%; max-width: 42rem; padding: 0 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .mark { display:block; width: 96px; height: 96px; margin-bottom: 20px; }
  .tag { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .15em; color: var(--dim); margin-bottom: 20px; text-transform: uppercase; }
  .tag b { color: var(--indigo); } .tag .d { color: var(--faint); } .tag .t { color: var(--dim); } .tag .o { opacity: .6; }
  h1 { margin: 0; font-family: 'OmarchyFont', var(--mono); font-weight: normal; font-size: clamp(36px, 9vw, 72px); color: var(--text); letter-spacing: .12em; user-select: none; }
  .main { animation: reveal 1.1s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes reveal { 0% { opacity: 0; filter: blur(10px); transform: scale(.96); letter-spacing: .3em; }
    100% { opacity: 1; filter: none; transform: none; letter-spacing: .12em; } }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  .badge .sep { color: var(--faint); } .badge .ed { color: var(--text); }
  #status { font-size: 12px; color: var(--dim); height: 20px; margin-top: 10px; display: flex; align-items: center; }
  #msg { transition: opacity .2s; }
  .cursor { display: inline-block; width: 6px; height: 14px; background: var(--indigo); margin-left: 4px; animation: blink .85s infinite; }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  .bar { width: 100%; max-width: 28rem; margin-top: 32px; padding: 0 16px; }
  .bar .row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; color: var(--dim); }
  .bar .row b { color: var(--indigo); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--signal); margin-right: 6px; }
  .track { height: 6px; background: var(--surface); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); padding: 1px; }
  #fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(to right, var(--indigo-deep), var(--indigo), var(--indigo-soft)); transition: width .6s cubic-bezier(.25,1,.5,1); }
  footer { position: relative; z-index: 30; width: 100%; max-width: 36rem; padding: 0 16px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .specs { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; font-size: 11px; color: var(--dim); border-top: 1px solid rgba(124,140,255,.18); padding-top: 12px; }
  .specs b { color: var(--indigo); font-weight: normal; margin-right: 8px; }
  .hint { font-size: 10px; color: var(--faint); letter-spacing: .1em; }
  .f1, .f2, .f3 { opacity: 0; animation: fade .8s ease-out forwards; } .f1 { animation-delay: .3s; } .f2 { animation-delay: .7s; } .f3 { animation-delay: 1.1s; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>

<script>
  // Prototype-only demo telemetry. The APK splash reads real progress from Java via A.state().
  const messages = [
    'Initializing hardware bridge & Wayland socket...',
    'Mounting /dev/pts and virtual sysfs nodes...',
    'Verifying pacman archlinux-keyring integrity...',
    'Configuring VirGL hardware acceleration...',
    'Starting D-Bus message bus daemon...',
    'Ready to launch AOmarchy user session.'
  ];
  let i = 0, progress = 0;
