name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (for example v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set: this release will carry a debug-signed APK."
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storePath=$RUNNER_TEMP/release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "AOMARCHY_SIGNING=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: apk
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect APK and checksum
        run: |
          mkdir -p dist
          if [ -f apk/build/outputs/apk/release/AOmarchy-release.apk ]; then
            cp apk/build/outputs/apk/release/AOmarchy-release.apk dist/
          else
            cp apk/build/outputs/apk/debug/AOmarchy-debug.apk dist/
          fi
          cd dist
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AOmarchy ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            **AOmarchy 2.2.1** — Arch Linux + Omarchy (Hyprland) on Android, in one APK. No root, no proot, no VM.

            This release was built and signed by GitHub Actions from the repository source.

            ## What is new in 2.2.1

            - **The console is a single instance now** (singleTop): the desktop-side settings entries and an
              `am start ... --ei app.aomarchy.TAB N` switch the page of the console that is already open instead of
              stacking a second one or ignoring the request.
            - Everything below is the 2.2 feature set, unchanged.

            ## What is new in 2.2

            - **The old settings screen is gone.** Everything it held now lives in the console as four native pages
              under 设置 → 详细设置, with the same cards as the rest of the app: 键盘与按键 (key binding, floating
              keyboard, accessibility key interception, extra keys bar and its layout editor, notifications, seven
              actions for the back/volume/media keys and the notification buttons), 触摸板与鼠标 (touchpad mode,
              pointer speed, capture with its transform, scroll direction/speed, gesture thresholds), 显示
              (orientation, display cutout, PiP) and 音频 (audio keep-alive, speaker/microphone latency).
              The WebView installer is gone as well: a fresh install now starts on 系统, where the native install
              card already was, and the big console button becomes 安装系统 until the system is there.
            - **Chinese and English.** 设置 → 语言 switches between 跟随系统 / 中文 / English and rebuilds the console
              in place. 391 strings cover the five pages, the four detail pages, the terminal, install/backup
              progress, the session notification and the toasts.
            - Desktop-side settings entries (the session notification's settings action, the extra keys bar's gear)
              now come back to the console's settings page instead of a second settings screen.
            - Everything from 2.1 stays: the terminal mode (about 700 MB less memory than the desktop), 备份与回滚,
              the Kinetik-style motion and the denser pages.

            ## Upgrading

            - From **2.1 / 2.0**: install over it, nothing else to do.
            - From **1.x**: the package is `app.aomarchy` and Android does not let one app read another app's private
              data, so a 1.x install cannot be migrated. Save what you need from the desktop, uninstall the old app,
              install AOmarchy and set the system up again (a local archive makes that work offline). The 1.x builds
              stay available in `wind-wh/AOmarchy-legacy`.

            ## Install

            Download the APK and open it. Android may ask to allow installing apps from this source. If a previous
            AOmarchy build signed with a different key is installed, uninstall it first.

            Checksum: run `sha256sum -c AOmarchy-release.apk.sha256`.

            > Debug-signed placeholder releases (no release key configured) are marked as pre-releases; they cannot
            > update a release-signed install.