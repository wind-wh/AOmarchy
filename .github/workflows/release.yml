name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (for example v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set: this release will carry a debug-signed APK."
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storePath=$RUNNER_TEMP/release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "AOMARCHY_SIGNING=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: apk
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect APK and checksum
        run: |
          mkdir -p dist
          if [ -f apk/build/outputs/apk/release/AOmarchy-release.apk ]; then
            cp apk/build/outputs/apk/release/AOmarchy-release.apk dist/
          else
            cp apk/build/outputs/apk/debug/AOmarchy-debug.apk dist/
          fi
          cd dist
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AOmarchy ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            **AOmarchy 2.8** — Arch Linux + Omarchy (Hyprland) on Android, in one APK. No root, no proot, no VM.

            This release was built and signed by GitHub Actions from the repository source.

            ## What is new in 2.8

            - **The console sits on your wallpaper.** The device wallpaper is drawn behind the console — blurred, under
              a heavy brand scrim — so the rail, cards and text stay as readable as before but the app feels like part
              of the home screen.
            - **A power button in the rail.** One tap at the bottom of the rail opens a session power menu: restart the
              session, stop it, start it, or quit the app (a running session keeps running). Its colour is also a status
              LED: mint while running, dim when ready, grey before Linux is installed.
            - **A quick-command panel in the terminal.** The terminal no longer fills the screen: the lower part is a
              panel of chips that send common commands in one tap (files, disk, memory, processes, system update,
              packages, services, network, logs, clear, exit). **编辑** makes the chips editable, **+ 新增** adds your
              own name + command, long-press deletes; the list lives in the app's settings and survives restarts. A
              **面板 / Panel** switch folds the panel away for a full-height terminal, and the pty is resized to match.
            - Everything from 2.7 stays: brand icon, home-screen widget, overview suggestions, quick settings tile.

            ## Upgrading

            - From **2.7 / 2.6 / 2.5 / 2.4 / 2.3 / 2.2 / 2.1 / 2.0**: install over it, nothing else to do.
            - From **1.x**: the package is `app.aomarchy`; save what you need from the desktop, uninstall the old app,
              install AOmarchy and set the system up again (a local archive makes that work offline).

            ## Install

            Download the APK and open it. Android may ask to allow installing apps from this source. If a previous
            AOmarchy build signed with a different key is installed, uninstall it first.

            Checksum: run `sha256sum -c AOmarchy-release.apk.sha256`.

            > Debug-signed placeholder releases (no release key configured) are marked as pre-releases; they cannot
            > update a release-signed install.