name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (for example v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set: this release will carry a debug-signed APK."
            exit 0
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storePath=$RUNNER_TEMP/release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.properties"
          echo "AOMARCHY_SIGNING=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: apk
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect APK and checksum
        run: |
          mkdir -p dist
          if [ -f apk/build/outputs/apk/release/AOmarchy-release.apk ]; then
            cp apk/build/outputs/apk/release/AOmarchy-release.apk dist/
          else
            cp apk/build/outputs/apk/debug/AOmarchy-debug.apk dist/
          fi
          cd dist
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AOmarchy ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ steps.signing.outputs.signed != 'true' }}
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            **AOmarchy 2.7** — Arch Linux + Omarchy (Hyprland) on Android, in one APK. No root, no proot, no VM.

            This release was built and signed by GitHub Actions from the repository source.

            ## What is new in 2.7

            - **A new app icon.** The launcher icon now speaks the console's language: a dark tile with the brand's
              four-panel glyph (three accent tiles, one mint) — an adaptive icon with a themeable monochrome layer for
              Android 13 — instead of the leftover green Omarchy box with the Android robot.
            - **A home-screen widget** (4×2): the session state (未安装 / 就绪 / 运行中 / 终端模式) plus one-tap
              控制台 and 终端 entries. It refreshes when the session starts or stops and follows the console's
              language. No background polling.
            - **Suggestions on the overview.** A new 智能建议 card reads the live numbers and offers the two most
              useful next actions: install Linux on a fresh device, clean backups when the system disk is nearly full,
              switch to terminal mode when memory is tight, open the desktop when the session is not running, or
              manage oversized backup folders. It only redraws when the suggestion changes.
            - Fixes: ending the session now resets the widget to 就绪 (the service's `started` flag was never cleared),
              and switching the interface language refreshes the widget immediately.
            - Everything from 2.6 stays: quick settings tile, backup retention and disk usage, Chinese/English console.

            ## Upgrading

            - From **2.6 / 2.5 / 2.4 / 2.3 / 2.2 / 2.1 / 2.0**: install over it, nothing else to do.
            - From **1.x**: the package is `app.aomarchy`; save what you need from the desktop, uninstall the old app,
              install AOmarchy and set the system up again (a local archive makes that work offline).

            ## Install

            Download the APK and open it. Android may ask to allow installing apps from this source. If a previous
            AOmarchy build signed with a different key is installed, uninstall it first.

            Checksum: run `sha256sum -c AOmarchy-release.apk.sha256`.

            > Debug-signed placeholder releases (no release key configured) are marked as pre-releases; they cannot
            > update a release-signed install.